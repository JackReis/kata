name: Dune import gates

# FAIL-closed production import graph. A missing policy, an empty deny list,
# or a prefix that matches no file exits 2. A banned edge exits 1.
# test-pr.yml calls the upstream reusable test workflow, so this file is the
# pull-request gate for this seat.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  import-gates:
    name: FAIL-closed import graph
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run import gates
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          go build -o "$tmp/duneimport" ./tools/duneimport
          "$tmp/duneimport"
